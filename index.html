<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة طلبة الدراسات العليا</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
/* ===== Variables ===== */
:root {
  --primary: #00695C;
  --primary-dark: #004D40;
  --primary-light: #80CBC4;
  --accent: #FFB300;
  --accent-light: #FFF8E1;
  --surface: #ffffff;
  --surface-alt: #F5FAFA;
  --border: #E0EFED;
  --text-main: #1A2E2B;
  --text-sub: #5C7A76;
  --text-muted: #9BB5B0;
  --danger: #E53935;
  --success: #43A047;
  --warning-bg: #FFFDE7;
  --warning-border: #FFD600;
  --warning-text: #7A5F00;
  --shadow-sm: 0 2px 8px rgba(0,77,64,.07);
  --shadow-md: 0 6px 24px rgba(0,77,64,.10);
  --shadow-lg: 0 16px 48px rgba(0,77,64,.13);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-pill: 50px;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', 'Tajawal', Tahoma, sans-serif;
  background: #EDF5F4;
  color: var(--text-main);
  direction: rtl;
  min-height: 100vh;
}

/* ===== Header ===== */
header {
  background: linear-gradient(120deg, var(--primary-dark) 0%, var(--primary) 60%, #00897B 100%);
  color: #fff;
  padding: 0 32px;
  height: 72px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-lg);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-icon {
  width: 42px;
  height: 42px;
  background: rgba(255,255,255,.15);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.header-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .3px;
}

.header-sub {
  font-size: 12px;
  font-weight: 400;
  opacity: .75;
  margin-top: 1px;
}

header .spacer { flex: 1; }

.header-badge {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: var(--radius-pill);
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== Edit Notice ===== */
#editNotice {
  display: none;
  background: var(--warning-bg);
  color: var(--warning-text);
  padding: 12px 32px;
  font-size: 14px;
  font-weight: 700;
  border-bottom: 2px solid var(--warning-border);
  display: none;
  align-items: center;
  gap: 10px;
  justify-content: center;
}

#editNotice .notice-dot {
  width: 8px; height: 8px;
  background: var(--warning-border);
  border-radius: 50%;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.5); opacity: .6; }
}

/* ===== Search Bar ===== */
.search-wrapper {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 18px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}

.search-field {
  position: relative;
  flex: 1;
  max-width: 460px;
}

.search-field svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-field input {
  width: 100%;
  padding: 11px 42px 11px 16px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: var(--text-main);
  background: var(--surface-alt);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  transition: all .2s;
  direction: rtl;
}

.search-field input:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,105,92,.1);
}

.search-field input::placeholder { color: var(--text-muted); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 22px;
  border: none;
  border-radius: var(--radius-pill);
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(0,105,92,.30);
}

.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,105,92,.35); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }

.btn-success {
  background: linear-gradient(135deg, var(--success) 0%, #2E7D32 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(67,160,71,.25);
}

.btn-ghost {
  background: var(--surface);
  color: var(--text-sub);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

/* ===== Autocomplete ===== */
#suggestions {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 500;
  overflow: hidden;
}

.suggest-item {
  padding: 11px 16px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-main);
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.suggest-item::before {
  content: '👤';
  font-size: 13px;
  opacity: .6;
}

.suggest-item:last-child { border-bottom: none; }
.suggest-item:hover { background: var(--surface-alt); }

.match {
  background: #FFE082;
  padding: 1px 3px;
  border-radius: 3px;
  font-weight: 700;
}

/* ===== Tabs ===== */
.tabs-container {
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 0 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-container::-webkit-scrollbar { display: none; }

.tabs {
  display: flex;
  gap: 2px;
  padding: 10px 0 0;
  min-width: max-content;
}

.tabs button {
  border: none;
  padding: 9px 18px 11px;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  font-weight: 600;
  transition: all .2s;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  position: relative;
  bottom: -2px;
}

.tabs button:hover { color: var(--primary); background: var(--surface-alt); }

.tabs button.active {
  color: var(--primary-dark);
  background: var(--surface);
  border-bottom: 2px solid var(--primary);
  font-weight: 700;
}

/* Tab number badge */
.tabs button .tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  background: var(--border);
  color: var(--text-sub);
  border-radius: 50%;
  font-size: 10px;
  font-weight: 700;
  margin-right: 5px;
}
.tabs button.active .tab-count {
  background: var(--primary);
  color: #fff;
}

/* ===== Sections ===== */
.section { display: none; padding: 24px 28px; }
.section.active { display: block; animation: fadeIn .2s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1.5px solid var(--border);
}

.section-header h2 {
  font-size: 17px;
  font-weight: 700;
  color: var(--primary-dark);
}

.section-header .section-count {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--surface-alt);
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
}

/* ===== Form Grid ===== */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
}

/* ===== Field Card ===== */
.field {
  background: var(--surface);
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  transition: border-color .2s, box-shadow .2s;
}

.field:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(0,105,92,.08);
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-sub);
  margin-bottom: 6px;
  letter-spacing: .2px;
}

.field input {
  width: 100%;
  padding: 8px 0;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: var(--text-main);
  border: none;
  border-bottom: 1.5px solid var(--border);
  background: transparent;
  transition: border-color .2s;
  direction: rtl;
}

.field input:focus {
  outline: none;
  border-bottom-color: var(--primary);
}

.field input::placeholder { color: var(--text-muted); font-size: 13px; }

.field input[readonly] {
  color: var(--primary-dark);
  font-weight: 700;
  cursor: default;
}

/* ===== Actions Bar ===== */
.actions-bar {
  background: var(--surface);
  border-top: 2px solid var(--border);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  position: sticky;
  bottom: 0;
  z-index: 90;
  box-shadow: 0 -4px 20px rgba(0,77,64,.07);
}

/* ===== Toast Notification ===== */
#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text-main);
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#toast.success { background: var(--success); }
#toast.error   { background: var(--danger); }

/* ===== Export Button ===== */
.btn-export {
  background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%);
  color: #fff;
  box-shadow: 0 4px 14px rgba(21,101,192,.30);
}
.btn-export:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(21,101,192,.4); }

/* ===== Confirm Modal ===== */
#confirmModal {
  position: fixed; inset: 0; z-index: 9000;
  display: flex; align-items: center; justify-content: center;
}
.modal-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(3px);
}
.modal-box {
  position: relative;
  background: #fff;
  border-radius: 20px;
  padding: 36px 40px;
  text-align: center;
  width: 400px;
  box-shadow: 0 24px 60px rgba(0,0,0,.18);
  animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(.85); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.modal-icon { font-size: 48px; margin-bottom: 12px; }
.modal-title { font-size: 18px; font-weight: 800; color: var(--primary-dark); margin-bottom: 10px; }
.modal-msg { font-size: 14px; color: var(--text-sub); line-height: 1.8; margin-bottom: 24px; }
.modal-msg strong { color: var(--text-main); font-size: 15px; display: block; margin-top: 4px; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  header { padding: 0 16px; }
  .header-badge { display: none; }
  .search-wrapper { padding: 14px 16px; flex-wrap: wrap; }
  .section { padding: 16px 14px; }
  .form-grid { grid-template-columns: 1fr; }
  .actions-bar { padding: 14px 16px; flex-wrap: wrap; }
  .modal-box { width: 90vw; padding: 24px 20px; }
}
</style>
</head>

<body>

<!-- ===== Header ===== -->
<header>
  <div class="header-icon">🎓</div>
  <div>
    <div class="header-title">منظومة طلبة الدراسات العليا</div>
    <div class="header-sub">كلية التخطيط العمراني</div>
  </div>
  <div class="spacer"></div>
  <div class="header-badge">🏛️ جامعة الكوفة</div>
</header>

<!-- ===== Edit Notice ===== -->
<div id="editNotice">
  <div class="notice-dot"></div>
  ⚠️ أنت الآن في وضع تعديل بيانات الطالب — يرجى مراجعة البيانات قبل الحفظ
</div>

<!-- ===== Search ===== -->
<div class="search-wrapper">
  <div class="search-field">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input id="searchBox"
           placeholder="ابحث برقم الطالب أو الاسم الرباعي..."
           oninput="suggestNames()">
    <div id="suggestions"></div>
  </div>
  <button class="btn btn-primary" onclick="searchStudent()">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    بحث
  </button>
</div>

<!-- ===== Tabs ===== -->
<div class="tabs-container">
  <div class="tabs" id="tabs"></div>
</div>

<!-- ===== Sections ===== -->
<div id="sections"></div>

<!-- ===== Actions Bar ===== -->
<div class="actions-bar">
  <button id="addBtn" class="btn btn-primary" onclick="addStudent()">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    إضافة طالب جديد
  </button>
  <button id="updateBtn" class="btn btn-success" onclick="saveUpdate()" style="display:none">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path d="M5 13l4 4L19 7"/>
    </svg>
    حفظ التعديلات
  </button>
  <button id="cancelBtn" class="btn btn-ghost" onclick="location.reload()" style="display:none">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
    إلغاء
  </button>
  <button id="exportBtn" class="btn btn-export" onclick="confirmExport()" style="display:none">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path d="M12 16l-4-4h3V4h2v8h3l-4 4z"/><path d="M4 20h16"/>
    </svg>
    تصدير سيرة دراسية
  </button>
</div>

<!-- Modal -->
<div id="confirmModal" style="display:none">
  <div class="modal-overlay" onclick="closeExportModal()"></div>
  <div class="modal-box">
    <div class="modal-icon">📄</div>
    <h3 class="modal-title">تصدير السيرة الدراسية</h3>
    <p class="modal-msg">هل تريد تصدير السيرة الدراسية للطالب<br><strong id="modalStudentName"></strong> ؟</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="doExportPDF()">نعم، تصدير</button>
      <button class="btn btn-ghost" onclick="closeExportModal()">لا، إلغاء</button>
    </div>
  </div>
</div>

<!-- ===== Toast ===== -->
<div id="toast"></div>

<script>

// ===== Build UI =====
(function buildUI(){
  const tabs = document.getElementById("tabs");
  const secs = document.getElementById("sections");
  let first = true;

  for(const t in TABS){
    const cols = TABS[t];

    // Tab button
    const b = document.createElement("button");
    b.innerHTML = `${t} <span class="tab-count">${cols.length}</span>`;
    if(first) b.classList.add("active");
    b.onclick = () => openTab(t, b);
    tabs.appendChild(b);

    // Section
    const sec = document.createElement("div");
    sec.id = t;
    sec.className = "section" + (first ? " active" : "");

    // Section header
    const hdr = document.createElement("div");
    hdr.className = "section-header";
    hdr.innerHTML = `<h2>${t}</h2><span class="section-count">${cols.length} حقل</span>`;
    sec.appendChild(hdr);

    // Grid
    const grid = document.createElement("div");
    grid.className = "form-grid";

    cols.forEach(c => {
      const div = document.createElement("div");
      div.className = "field";
      div.innerHTML = `<label>${c}</label><input id="${c}" placeholder="أدخل ${c}" ${c === "رقم الطالب" ? 'readonly' : ''}>`;
      grid.appendChild(div);
    });

    sec.appendChild(grid);
    secs.appendChild(sec);
    first = false;
  }
})();

function openTab(id, btn){
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

// ===== Toast =====
function showToast(msg, type = ""){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + type;
  setTimeout(() => t.className = "", 3000);
}

// ===== API =====
function post(action, payload){
  const f = new FormData();
  f.append("action", action);
  f.append("payload", JSON.stringify(payload));
  return fetch(API_URL, { method: "POST", body: f }).then(r => r.json());
}

fetch(API_URL).then(r => r.json()).then(d => {
  document.getElementById("رقم الطالب").value = d.nextId;
});

// ===== Add Student =====
function addStudent(){
  if(MODE !== "ADD") return;
  const row = ALL_COLUMNS.map(c => document.getElementById(c).value || "");
  post("add", { row }).then(() => showToast("✅ تمت إضافة الطالب بنجاح", "success"));
}

// ===== Search =====
function searchStudent(){
  const raw = (_selectedNameFromSuggest || document.getElementById("searchBox").value).trim();
  _selectedNameFromSuggest = null;
  if(!raw) return;

  // نرسل الاستعلام كما هو — الـ API يستخدم clean() للمقارنة
  post("search", { query: raw }).then(d => {
    if(!d.found){
      // محاولة ثانية: نبحث عبر الاقتراحات ثم نأخذ أول نتيجة ونبحث بها مباشرة
      post("suggest", { query: raw }).then(s2 => {
        if(s2.suggestions && s2.suggestions.length > 0){
          // وجدنا اسماً مطابقاً في الاقتراحات، نبحث به مباشرة
          post("search", { query: s2.suggestions[0] }).then(d2 => {
            if(!d2.found) return showToast("❌ الطالب غير موجود", "error");
            doLoadStudent(d2);
          });
        } else {
          showToast("❌ الطالب غير موجود", "error");
        }
      });
      return;
    }
    doLoadStudent(d);
  });
}

function doLoadStudent(d){
  if(confirm("الطالب موجود، هل تريد تعديل بياناته؟")){
    MODE = "EDIT";
    currentRowIndex = d.rowIndex;
    ALL_COLUMNS.forEach((c, i) => {
      document.getElementById(c).value = d.row[i] || "";
    });
    document.getElementById("updateBtn").style.display = "inline-flex";
    document.getElementById("cancelBtn").style.display = "inline-flex";
    document.getElementById("addBtn").style.display = "none";
    document.getElementById("exportBtn").style.display = "inline-flex";
    document.getElementById("editNotice").style.display = "flex";
    showToast("✅ تم تحميل بيانات الطالب", "success");
  }
}

// ===== Save Update =====
function saveUpdate(){
  if(MODE !== "EDIT") return;

  const btn = document.getElementById("updateBtn");
  const original = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = `<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="animation:spin .8s linear infinite"><path d="M4 12a8 8 0 018-8v4l3-3-3-3v4a10 10 0 100 10"/></svg> جارِ الحفظ...`;

  const row = ALL_COLUMNS.map(c => document.getElementById(c).value || "");

  post("update", { rowIndex: currentRowIndex, row }).then(() => {
    btn.innerHTML = `<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg> تم الحفظ`;
    showToast("✅ تم حفظ التعديلات بنجاح", "success");
    setTimeout(() => {
      btn.innerHTML = original;
      btn.disabled = false;
    }, 1800);
  });
}

// ===== Autocomplete =====
function highlightMatch(text, query){
  if(!query) return text;
  const q = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(q, "gi"), m => `<span class="match">${m}</span>`);
}

// حفظ الاسم النظيف المختار من الاقتراحات
let _selectedNameFromSuggest = null;

function suggestNames(){
  const q = document.getElementById("searchBox").value.trim();
  const box = document.getElementById("suggestions");
  // عند الكتابة من جديد نلغي الاسم المحفوظ
  _selectedNameFromSuggest = null;
  if(q.length < 2){ box.style.display = "none"; return; }
  post("suggest", { query: q }).then(d => {
    box.innerHTML = "";
    if(!d.suggestions || !d.suggestions.length){ box.style.display = "none"; return; }
    d.suggestions.forEach(name => {
      const div = document.createElement("div");
      div.className = "suggest-item";
      // نعرض الاسم مع تمييز الجزء المطابق لكن نحفظ النص الأصلي النظيف
      div.innerHTML = highlightMatch(name, q);
      div.onclick = () => {
        _selectedNameFromSuggest = name;  // الاسم النظيف كما جاء من الشيت
        document.getElementById("searchBox").value = name;
        box.style.display = "none";
        searchStudent();                  // بحث فوري تلقائي بالاسم الدقيق
      };
      box.appendChild(div);
    });
    box.style.display = "block";
  });
}

document.addEventListener("click", e => {
  if(!e.target.closest(".search-wrapper"))
    document.getElementById("suggestions").style.display = "none";

// ===== Generate PDF from Excel Template via Google Apps Script =====
function doExportPDF(){
  closeExportModal();

  const studentId = fv("رقم الطالب");
  if(!studentId){ showToast("يرجى البحث عن الطالب أولاً","error"); return; }

  const exportBtn = document.getElementById("exportBtn");
  const origHTML = exportBtn.innerHTML;
  exportBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> جاري التحضير...`;
  exportBtn.disabled = true;

  fetch(API_URL + "?action=exportPDF&studentId=" + encodeURIComponent(studentId))
    .then(r => r.json())
    .then(data => {
      exportBtn.innerHTML = origHTML;
      exportBtn.disabled = false;
      if(data.error){ showToast("خطأ: " + data.error, "error"); return; }
      if(data.pdfBase64){
        const byteChars = atob(data.pdfBase64);
        const byteArr = new Uint8Array(byteChars.length);
        for(let i=0;i<byteChars.length;i++) byteArr[i]=byteChars.charCodeAt(i);
        const blob = new Blob([byteArr],{type:"application/pdf"});
        const url = URL.createObjectURL(blob);
        const win = window.open(url,"_blank");
        if(!win){ showToast("يرجى السماح بالنوافذ المنبثقة","error"); return; }
        showToast("تم توليد PDF بنجاح ✓","success");
      } else if(data.pdfUrl){
        window.open(data.pdfUrl,"_blank");
        showToast("تم توليد PDF بنجاح ✓","success");
      } else {
        showToast("لم يتم استلام الملف من الخادم","error");
      }
    })
    .catch(err => {
      exportBtn.innerHTML = origHTML;
      exportBtn.disabled = false;
      showToast("تعذّر الاتصال بالخادم","error");
      console.error(err);
    });
}
